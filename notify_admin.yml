name: DoorDash Admin Reminder

on:
  schedule:
    # Runs at 9am PT every Friday
    # Note: GitHub Actions uses UTC, so 9am PT = 17:00 UTC (PST) or 16:00 UTC (PDT)
    # Using 16:00 UTC for PDT (adjust if needed)
    - cron: '0 16 * * 5'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  notify_admin:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack DM to admin
        env:
          SLACK_ADMIN_WEBHOOK_URL: ${{ secrets.SLACK_ADMIN_WEBHOOK_URL }}
          DOORDASH_CALENDAR_URL: ${{ vars.DOORDASH_CALENDAR_URL }}
        run: |
          curl -X POST "$SLACK_ADMIN_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"👋 Reminder: Please set up the restaurants for this weekend! <${DOORDASH_CALENDAR_URL}|Click here to access the meal calendar>\"
            }"
