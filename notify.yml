name: DoorDash Meal Reminder

on:
  schedule:
    # Runs at 9am PT every Saturday and Sunday
    # Note: GitHub Actions uses UTC, so 9am PT = 17:00 UTC (PST) or 16:00 UTC (PDT)
    # Using 16:00 UTC for PDT (adjust if needed)
    - cron: '0 16 * * 0,6'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🍕 Weekend meals are up! <https://www.doordash.com/teams/calendar?|Click here to order> for today'\''s lunch and dinner."
            }'
